<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Perpustakaan SMAN 1 Ngambur</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #f8fafc; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card { 
            background: white; padding: 40px; border-radius: 20px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; 
        }
        .login-card h2 { margin: 0 0 5px; color: #1e293b; font-size: 24px; }
        .login-card p { margin: 0 0 30px; color: #64748b; font-size: 14px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: #475569; font-weight: 600; font-size: 14px; }
        .input-group input { 
            width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 10px; 
            outline: none; box-sizing: border-box; font-size: 15px; transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: #4f46e5; }
        .btn-login { 
            background: #4f46e5; color: white; width: 100%; padding: 14px; 
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s;
        }
        .btn-login:hover { background: #4338ca; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3); }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="background: #eef2ff; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
            <i class="fas fa-user-shield" style="font-size: 30px; color: #4f46e5;"></i>
        </div>
        <h2>Portal Login</h2>
        <p>Perpustakaan SMAN 1 Ngambur</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Masuk Sekarang</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // 1. Cek Login Admin (Bisa Semua Menu)
            if(u === 'admin' && p === 'admin123') {
                Swal.fire({ 
                    icon: 'success', title: 'Login Admin Berhasil!', text: 'Mengarahkan ke Dashboard...',
                    showConfirmButton: false, timer: 1500 
                }).then(() => {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userRole', 'admin'); // Simpan peran sebagai admin
                    window.location.href = 'index.html';
                });
            } 
            // 2. Cek Login Staf (Hanya Menu Katalog)
            else if(u === 'staf' && p === 'staf123') {
                Swal.fire({ 
                    icon: 'success', title: 'Login Staf Berhasil!', text: 'Mengarahkan ke Katalog...',
                    showConfirmButton: false, timer: 1500 
                }).then(() => {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userRole', 'staff'); // Simpan peran sebagai staf
                    window.location.href = 'index.html';
                });
            } 
            // 3. Jika Salah
            else {
                Swal.fire({ icon: 'error', title: 'Gagal Login', text: 'Username atau Password salah!' });
            }
        });
    </script>
</body>
</html>
